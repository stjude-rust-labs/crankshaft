[workspace]
members = [
    "crankshaft",
    "crankshaft-config",
    "crankshaft-console",
    "crankshaft-docker",
    "crankshaft-engine",
    "crankshaft-events",
    "crankshaft-monitor",
    "examples",
]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"
authors = ["The Rust WDL project developers"]
homepage = "https://github.com/stjude-rust-labs/crankshaft"
repository = "https://github.com/stjude-rust-labs/crankshaft"
rust-version = "1.91.1"

[workspace.dependencies]
anyhow = "1.0.104"
approx = "0.5.1"
async-stream = "0.3.6"
async-trait = "0.1.92"
base64 = "0.23"
bollard = "0.21.1"
bon = "3.10.0"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
color-eyre = { version = "0.6", features = ["issue-url"] }
config = { version = "0.15.25", default-features = false, features = ["toml", "json", "yaml"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
futures = "0.3.34"
futures-core = "0.3.34"
futures-util = "0.3.34"
growable-bloom-filter = "2.1.1"
indexmap = { version = "2.14.0", features = ["serde"] }
indicatif = "0.18.6"
nix = { version = "0.31.3", default-features = false, features = ["user"] }
nonempty = "0.12.0"
prost = "0.14.4"
prost-types = "0.14.4"
rand = "0.10.2"
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9"
shlex = "2.0.1"
ssh2 = "0.9.6"
tar = "0.4.46"
tempfile = "3.27.0"
tes = { version = "0.10.1", features = ["client", "serde"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full", "time", "tracing"] }
tokio-metrics = "0.5.1"
tokio-retry2 = { version = "0.9", features = ["jitter"] }
tokio-stream = "0.1.19"
tokio-test = "0.4.5"
tokio-util = "0.7.19"
toml = "1.1.4"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.25.0", features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
] }
whoami = "2.1.3"

[workspace.lints.rust]
missing_docs = "warn"
rust-2018-idioms = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[workspace.lints.clippy]
missing_docs_in_private_items = "warn"
