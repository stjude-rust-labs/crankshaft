syntax = "proto3";

import "google/protobuf/timestamp.proto";

package crankshaft.monitor;

// The monitor service implements real-time monitoring of Crankshaft events.
service Monitor {
  // Subscribes to the Crankshaft event stream.
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream Event) {}
  // Gets the current service state.
  rpc GetServiceState(ServiceStateRequest) returns (ServiceStateResponse) {}
  // Cancels a task 
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse) {}
}

// The request for cancelling a task
message CancelTaskRequest{
  uint64 id = 1;
}

// The response of task cancel event
message CancelTaskResponse {}

// The request for retrieving the current service state.
message ServiceStateRequest {}

// The response containing the current service state.
message ServiceStateResponse {
  // The current set of tasks.
  map<uint64, TaskEvents> tasks = 1;
}

message TaskEvents {
  repeated Event events = 1;
}

// The request for subscribing to the task events stream.
message SubscribeEventsRequest {}

// Represents a Crankshaft event.
message Event {
  // The timestamp of the event.
  google.protobuf.Timestamp timestamp = 1;
  oneof event_kind {
    // The task created event.
    TaskCreatedEvent created = 2;
    // The task started event.
    TaskStartedEvent started = 3;
    // The task container created event.
    TaskContainerCreatedEvent container_created = 4;
    // The task container exited event.
    TaskContainerExitedEvent container_exited = 5;
    // The task completed event.
    TaskCompletedEvent completed = 6;
    // The task failed event.
    TaskFailedEvent failed = 7;
    // The task canceled event.
    TaskCanceledEvent canceled = 8;
    // The task preempted event.
    TaskPreemptedEvent preempted = 9;
    // The task stdout event.
    TaskStdoutEvent stdout = 10;
    // The task stderr event.
    TaskStderrEvent stderr = 11;
    // The image pull event.
    ImagePullStartedEvent image_pull_started = 12;
    // The image pull failed event.
    ImagePullFailedEvent image_pull_failed = 13;
    // The image pull finished event.
    ImagePullFinishedEvent image_pull_finished = 14;
    // The task resource usage event.
    TaskResourceUsageEvent resource_usage = 15;
  }
}

// Represents an exit status.
message ExitStatus {
  oneof ExitStatusKind {
    // The exit was from an exit code.
    int32 code = 1;
    // The exit was from a signal.
    // Note: this field is only specified on Unix when the process exited with a signal.
    int32 signal = 2;
  }
}

// Represents a task created event.
message TaskCreatedEvent {
  // The id of the task.
  uint64 id = 1;
  // The name of the task.
  string name = 2;
  // The TES identifier of the task.
  // Note: this field is only sent for the TES backend.
  optional string tes_id = 3;
}

// Represents a task started event.
message TaskStartedEvent {
  // The id of the task.
  uint64 id = 1;
}

// Represents a task container created event.
// Note: this event is only sent for the Docker backend.
message TaskContainerCreatedEvent {
  // The id of the task.
  uint64 id = 1;
  // The id of the container that was created.
  string container = 2;
}

// Represents a task container exited event.
// Note: this event is only sent for the Docker backend.
message TaskContainerExitedEvent {
  // The id of the task.
  uint64 id = 1;
  // The id of the container that exited.
  string container = 2;
  // The exit status of the container.
  ExitStatus exit_status = 3;
}

// Represents a task completed event.
message TaskCompletedEvent {
  // The id of the task.
  uint64 id = 1;
  // The exit statuses for each execution of the task.
  repeated ExitStatus exit_statuses = 2;
}

// Represents a task failed event.
message TaskFailedEvent {
  // The id of the task.
  uint64 id = 1;
  // The error message.
  string message = 2;
}

// Represents a task canceled event.
message TaskCanceledEvent {
  // The id of the task.
  uint64 id = 1;
}

// Represents a task preempted event.
message TaskPreemptedEvent {
  // The id of the task.
  uint64 id = 1;
}

// Represents a task stdout event.
// Note: this event is only sent for the Docker backend.
message TaskStdoutEvent {
  // The id of the task.
  uint64 id = 1;
  // The stdout message.
  bytes message = 2;
}

// Represents a task stderr event.
// Note: this event is only sent for the Docker backend.
message TaskStderrEvent {
  // The id of the task.
  uint64 id = 1;
  // The stderr message.
  bytes message = 2;
}

// Represents an image pull event.
//
// ## Implementation Notes
//
// * This event indicates that an actual fetch process is initiated.
// Backends **should not** emit this if the image is already present.
// * Backends *may* emit this event multiple times for the same image if
//   multiple executions request it.
//
// This event is always paired with either an `ImagePullFinished` or `ImagePullFailed` event.
message ImagePullStartedEvent {
  // The id of the task that triggered the pull.
  uint64 id = 1;
  // The name of the image being pulled.
  string name = 2;
}

// Represents an image pull finished event.
//
// Note: This indicates the termination of an image pull. It **will not** be paired with an
// `ImagePullFinished` event.
message ImagePullFailedEvent {
  // The id of the task that triggered the pull.
  uint64 id = 1;
  // The name of the image that was pulled.
  string name = 2;
  // The error message.
  string message = 3;
}

// Represents an image pull finished event.
message ImagePullFinishedEvent {
  // The id of the task that triggered the pull.
  uint64 id = 1;
  // The name of the image that was pulled.
  string name = 2;
}

// Represents a task resource usage event.
//
// Each emission is a cumulative snapshot of the task's resource utilization;
// the last snapshot received for a task is authoritative. Fields that were
// not observed by the backend are unset.
message TaskResourceUsageEvent {
  // The id of the task.
  uint64 id = 1;
  // The maximum resident memory observed, in bytes.
  optional uint64 max_memory = 2;
  // The average resident memory observed, in bytes.
  optional uint64 avg_memory = 3;
  // The total CPU time consumed, in milliseconds.
  optional uint64 cpu_time_ms = 4;
  // The user-mode CPU time consumed, in milliseconds.
  optional uint64 user_cpu_time_ms = 5;
  // The system-mode CPU time consumed, in milliseconds.
  optional uint64 system_cpu_time_ms = 6;
  // The disk space used, in bytes.
  optional uint64 disk_used = 7;
}
